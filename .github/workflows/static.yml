# Deploy NEXTLI static site from public/ to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site from public/
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source = Path("public")
          output = Path("_site")
          if not (source / "index.html").is_file():
              raise SystemExit("ERROR: public/index.html no existe; se cancela el despliegue.")
          if output.exists():
              shutil.rmtree(output)
          shutil.copytree(source, output)
          # GitHub Pages project sites live below /<repository>/, so convert
          # local root-absolute asset paths into paths relative to the site.
          targets = (
              "images", "pwa", "configurator\\.css", "catalog\\.css",
              "config\\.js", "cert-assets\\.js", "certificate\\.js",
              "inventory\\.js", "app\\.js"
          )
          pattern = re.compile(r"(?<!:) /(?=(" + "|".join(targets) + r")(?:/|['\"?#)]|$))".replace(" ", ""))
          for file in output.rglob("*"):
              if file.is_file() and file.suffix.lower() in {".html", ".js", ".css", ".json", ".webmanifest"}:
                  text = file.read_text(encoding="utf-8")
                  text = pattern.sub("./", text)
                  file.write_text(text, encoding="utf-8")
          (output / ".nojekyll").touch()
          print("Prepared GitHub Pages artifact from public/ with project-site paths.")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
