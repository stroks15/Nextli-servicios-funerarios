# Deploy NEXTLI static site from public/ to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site from public/
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source = Path("public")
          output = Path("_site")
          if not (source / "index.html").is_file():
              raise SystemExit("ERROR: public/index.html no existe; se cancela el despliegue.")
          if output.exists():
              shutil.rmtree(output)
          shutil.copytree(source, output)

          # Project Pages sites live under /<repository>/. Rewrite local
          # root-absolute asset URLs so CSS, JS, images and PWA files resolve.
          targets = (
              "images", "pwa", "configurator.css", "catalog.css",
              "config.js", "cert-assets.js", "certificate.js",
              "inventory.js", "app.js"
          )
          pattern = re.compile(
              r"(?<!:)/(?=(" + "|".join(re.escape(item) for item in targets)
              + r")(?:/|['\"?#)]|$))"
          )
          for file in output.rglob("*"):
              if file.is_file() and file.suffix.lower() in {".html", ".js", ".css", ".json", ".webmanifest"}:
                  content = file.read_text(encoding="utf-8")
                  content = pattern.sub("./", content)
                  file.write_text(content, encoding="utf-8")
          (output / ".nojekyll").touch()
          print("Prepared GitHub Pages artifact from public/ with project-site paths.")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
